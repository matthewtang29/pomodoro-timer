<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pomegranate tests</title>
<!-- Unit tests for boardsync.js (desk-robot task sync). No dependencies: open this page
     in a browser (from a local server or GitHub Pages) and read the results. -->
<style>
  :root { --bg: #fafaf7; --text: #1b1b19; --muted: #67655f; --ok: #3f7a4b; --bad: #b4422e; --line: #e9e7e0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151715; --text: #e8e6e1; --muted: #a19e98; --ok: #9cc7a3; --bad: #f2aa8a; --line: #2c302d; } }
  body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  #summary { margin: 0 0 20px; font-weight: 600; }
  h2 { font-size: 14px; margin: 20px 0 6px; color: var(--muted); }
  li { list-style: none; padding: 4px 0; border-bottom: 1px solid var(--line); font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; overflow-wrap: anywhere; }
  ul { margin: 0; padding: 0; }
  .ok::before { content: "✓ "; color: var(--ok); }
  .bad { color: var(--bad); } .bad::before { content: "✕ "; }
</style>
</head>
<body>
<main>
  <h1>Desk robot tests</h1>
  <p id="summary">Running…</p>
  <div id="out"></div>
</main>
<script src="boardsync.js"></script>
<script src="claudestatus.js"></script>
<script>
(async () => {
  const { dueLabel, cleanTitle, taskLines, syncTasksToBoard, _resetLastSent } = BoardSync;
  const out = document.getElementById('out');
  let pass = 0, fail = 0, list = null;

  function group(name) {
    out.insertAdjacentHTML('beforeend', '<h2></h2><ul></ul>');
    out.lastElementChild.previousElementSibling.textContent = name;
    list = out.lastElementChild;
  }
  function eq(name, got, want) {
    const ok = JSON.stringify(got) === JSON.stringify(want);
    ok ? pass++ : fail++;
    const li = document.createElement('li');
    li.className = ok ? 'ok' : 'bad';
    li.textContent = ok ? name : `${name}: got ${JSON.stringify(got)}, want ${JSON.stringify(want)}`;
    list.append(li);
  }

  // Wednesday 11 Nov 2026, mid-afternoon local time
  const now = new Date(2026, 10, 11, 15, 0);

  group('dueLabel');
  eq('yesterday -> Late', dueLabel('2026-11-10', now), 'Late');
  eq('last month -> Late', dueLabel('2026-10-02', now), 'Late');
  eq('today -> Today', dueLabel('2026-11-11', now), 'Today');
  eq('tomorrow -> Tmrw', dueLabel('2026-11-12', now), 'Tmrw');
  eq('2 days -> weekday (Fri)', dueLabel('2026-11-13', now), 'Fri');
  eq('6 days -> weekday (Tue)', dueLabel('2026-11-17', now), 'Tue');
  eq('7 days -> M/D', dueLabel('2026-11-18', now), '11/18');
  eq('next year -> M/D', dueLabel('2027-01-05', now), '1/5');
  eq('accepts a Date too', dueLabel(new Date(2026, 10, 12, 9, 30), now), 'Tmrw');
  eq('label fits the board (<= 5 chars, no spaces)',
    ['2026-11-10', '2026-11-11', '2026-11-12', '2026-11-15', '2026-12-25'].every(d => /^\S{1,5}$/.test(dueLabel(d, now))), true);

  group('dueLabel: midnight rollover');
  const lastMs = new Date(2026, 10, 11, 23, 59, 59, 999);
  const firstMs = new Date(2026, 10, 12, 0, 0, 0, 0);
  eq('23:59:59.999 the day before -> Tmrw', dueLabel('2026-11-12', lastMs), 'Tmrw');
  eq('00:00:00.000 that day -> Today', dueLabel('2026-11-12', firstMs), 'Today');
  eq('due yesterday, just after midnight -> Late', dueLabel('2026-11-11', firstMs), 'Late');
  eq('7 days becomes 6 at midnight (M/D -> weekday)', [dueLabel('2026-11-18', lastMs), dueLabel('2026-11-18', firstMs)], ['11/18', 'Wed']);
  // the 25-hour day when daylight saving ends (Sun 1 Nov 2026 in North America)
  eq('across the DST change: 2 days -> weekday', dueLabel('2026-11-02', new Date(2026, 9, 31, 12)), 'Mon');
  eq('across the DST change: tomorrow -> Tmrw', dueLabel('2026-11-02', new Date(2026, 10, 1, 23, 30)), 'Tmrw');

  group('cleanTitle');
  eq('emoji stripped', cleanTitle('📚 Read ch 4 🎉'), 'Read ch 4');
  eq('cut to 15 chars', cleanTitle('abcdefghijklmnopqrstuvwxyz'), 'abcdefghijklmno');
  eq('exactly 15 kept', cleanTitle('123456789012345'), '123456789012345');
  eq('only emoji -> -', cleanTitle('🎉🔥'), '-');
  eq('empty -> -', cleanTitle(''), '-');
  eq('spaces only -> -', cleanTitle('   '), '-');
  eq('missing -> -', cleanTitle(undefined), '-');
  eq('accented letters dropped (not ASCII)', cleanTitle('Café notes'), 'Caf notes');
  eq('tabs / newlines dropped', cleanTitle('a\tb\nc'), 'abc');
  eq('no trailing space after the cut', cleanTitle('Lab report for ECE'), 'Lab report for');

  group('taskLines');
  const items = [
    { id: 'a', title: 'Undated', due: '', done: null },
    { id: 'b', title: 'Done already', due: '2026-11-09', done: 1 },
    { id: 'c', title: 'Problem set 6', due: '2026-11-13', done: null },
    { id: 'd', title: 'Overdue essay', due: '2026-11-08', done: null },
    { id: 'e', title: '🧪 Lab report', due: '2026-11-11', done: null },
    { id: 'f', title: 'Read chapter 4', due: '2026-11-12', done: null },
    { id: 'g', title: 'Fifth task', due: '2026-12-01', done: null },
  ];
  eq('TASKS CLR first, oldest due first, max 4, done and undated skipped', taskLines(items, now), [
    'TASKS CLR',
    'TASK Late Overdue essay',
    'TASK Today Lab report',
    'TASK Tmrw Read chapter 4',
    'TASK Fri Problem set 6',
  ]);
  eq('no tasks -> just TASKS CLR', taskLines([], now), ['TASKS CLR']);

  group('syncTasksToBoard');
  _resetLastSent();
  const sent = [];
  const writeLine = l => { sent.push(l); return Promise.resolve(); };
  await syncTasksToBoard(items, writeLine, false, now);
  eq('first call sends the full set', sent.length, 5);
  sent.length = 0;
  await syncTasksToBoard(items, writeLine, false, now);
  eq('unchanged -> sends nothing', sent.length, 0);
  await syncTasksToBoard(items.map(t => ({ ...t, focusSec: 999 })), writeLine, false, now);
  eq('unrelated change (focus time) -> sends nothing', sent.length, 0);
  await syncTasksToBoard(items, writeLine, true, now);
  eq('force (EVENT SYNC) -> resends unchanged set', sent.length, 5);
  sent.length = 0;
  await syncTasksToBoard(items, writeLine, false, new Date(2026, 10, 12, 0, 1));
  eq('after midnight the labels change -> resends', sent.slice(1, 3), ['TASK Late Overdue essay', 'TASK Late Lab report']);

  // ================================================================ claudestatus.js
  const C = ClaudeStatus;
  const T0 = new Date(2026, 10, 11, 15, 0).getTime();   // Wed 11 Nov 2026, 3:00 pm local
  const MIN = 60e3, H = 3600e3;
  const run = (name, startedAgo, updatedAgo = 0, now = T0) => ({ sid: name, name, project: 'p', state: 'running', startedAt: now - startedAgo, updatedAt: now - updatedAgo });
  const done = (job, finishedAgo, now = T0, extra = {}) => ({ ...job, state: 'done', finishedAt: now - finishedAgo, updatedAt: now - finishedAgo, ...extra });

  group('claudestatus: reset labels');
  eq('5h: 3:10a', C.resetLabel(new Date(2026, 10, 12, 3, 10).getTime(), '5h', T0), '3:10a');
  eq('5h: 12:05p (noon hour)', C.resetLabel(new Date(2026, 10, 12, 12, 5).getTime(), '5h', T0), '12:05p');
  eq('5h: 12:05a (midnight hour)', C.resetLabel(new Date(2026, 10, 12, 0, 5).getTime(), '5h', T0), '12:05a');
  eq('5h: 11:59p', C.resetLabel(new Date(2026, 10, 11, 23, 59).getTime(), '5h', T0), '11:59p');
  eq('week: Fri7:00p', C.resetLabel(new Date(2026, 10, 13, 19, 0).getTime(), 'week', T0), 'Fri7:00p');
  eq('week: longest is 9 chars (Wed12:59p)', C.resetLabel(new Date(2026, 10, 18, 12, 59).getTime(), 'week', T0), 'Wed12:59p');
  eq('already passed -> -', C.resetLabel(T0 - MIN, '5h', T0), '-');
  eq('exactly now -> -', C.resetLabel(T0, 'week', T0), '-');
  eq('0 -> -', C.resetLabel(0, '5h', T0), '-');
  eq('missing -> -', C.resetLabel(undefined, 'week', T0), '-');

  group('claudestatus: USAGE line');
  eq('week first, integers, both labels', C.usageLine({ fiveHour: 41.6, fiveHourResetsAt: new Date(2026, 10, 11, 18, 10).getTime(),
    sevenDay: 12.2, sevenDayResetsAt: new Date(2026, 10, 13, 19, 0).getTime(), updatedAt: T0 }, T0), 'USAGE 12 42 Fri7:00p 6:10p');
  eq('out of range clamped, past resets -> -', C.usageLine({ fiveHour: 130, fiveHourResetsAt: T0 - 1, sevenDay: -5, sevenDayResetsAt: 0 }, T0), 'USAGE 0 100 - -');
  eq('no usage -> nothing to send', C.usageLine(undefined, T0), null);

  group('claudestatus: slots');
  let st = C.newState();
  const a = run('Fix the build', 5 * MIN), b = run('Write tests', 3 * MIN), c = run('Third job', 1 * MIN);
  eq('initial load: two running jobs, oldest first', C.step(st, { sa: a, sb: b }, T0, 'initial'), ['CLAUDE JOB 0 ? Fix the build', 'CLAUDE JOB 1 ? Write tests']);
  eq('unrelated snapshot (updatedAt bump) -> nothing', C.step(st, { sa: { ...a, updatedAt: T0 }, sb: b }, T0, 'live'), []);
  eq('both slots busy: a third job is ignored', C.step(st, { sa: a, sb: b, sc: c }, T0, 'live'), []);
  eq('renamed job -> resent in the same slot', C.step(st, { sa: a, sb: { ...b, name: 'Write more tests' }, sc: c }, T0, 'live'), ['CLAUDE JOB 1 ? Write more tests']);
  eq('slot 0 frees (job gone) -> END, and the waiting job takes slot 0',
    C.step(st, { sb: { ...b, name: 'Write more tests' }, sc: c }, T0, 'live'), ['CLAUDE JOB 0 END', 'CLAUDE JOB 0 ? Third job']);
  eq('sticky: slot 1 job never moves', st.slots, ['sc', 'sb']);
  eq('resync (EVENT SYNC): resend both slots, no DONE', C.step(st, { sb: { ...b, name: 'Write more tests' }, sc: c }, T0, 'resync'),
    ['CLAUDE JOB 0 ? Third job', 'CLAUDE JOB 1 ? Write more tests']);
  st = C.newState();
  eq('initial load with one job: END for the empty slot', C.step(st, { sa: a }, T0, 'initial'), ['CLAUDE JOB 0 ? Fix the build', 'CLAUDE JOB 1 END']);
  eq('nothing running on load -> END both', C.step(C.newState(), {}, T0, 'initial'), ['CLAUDE JOB 0 END', 'CLAUDE JOB 1 END']);
  eq('stale running job (4 h old) is ignored', C.step(C.newState(), { old: run('Old', 5 * H, 4 * H) }, T0, 'initial'), ['CLAUDE JOB 0 END', 'CLAUDE JOB 1 END']);
  st = C.newState(); C.step(st, { sa: a }, T0, 'initial');
  eq('slotted job going stale (minute tick) -> END', C.step(st, { sa: a }, T0 + 3 * H, 'live'), ['CLAUDE JOB 0 END']);
  eq('name: emoji stripped, cut to 20', C.step(C.newState(), { x: run('🚀 Refactor the whole serial layer', MIN) }, T0, 'initial')[0], 'CLAUDE JOB 0 ? Refactor the whole s');

  group('claudestatus: DONE decision');
  const longJob = run('Long job', 2 * MIN);
  st = C.newState(); C.step(st, { j: longJob }, T0, 'initial');
  eq('live, finished now, ran 2 min -> DONE', C.step(st, { j: done(longJob, 0) }, T0, 'live'), ['CLAUDE JOB 0 DONE Long job']);
  eq('slot is free after DONE', st.slots, [null, null]);
  const shortJob = run('Quick Q', 10e3);
  st = C.newState(); C.step(st, { j: shortJob }, T0, 'initial');
  eq('live but only 10 s -> END (no chime)', C.step(st, { j: done(shortJob, 0) }, T0, 'live'), ['CLAUDE JOB 0 END']);
  const edge = run('Edge', C.MIN_DONE_MS);
  st = C.newState(); C.step(st, { j: edge }, T0, 'initial');
  eq('exactly 20 s -> DONE', C.step(st, { j: done(edge, 0) }, T0, 'live'), ['CLAUDE JOB 0 DONE Edge']);
  st = C.newState(); C.step(st, { j: longJob }, T0 - 10 * MIN, 'initial');
  eq('finished 3 min ago -> END (history, not live)', C.step(st, { j: done(longJob, 3 * MIN) }, T0, 'live'), ['CLAUDE JOB 0 END']);
  eq('initial load of a done job -> never DONE', C.step(C.newState(), { j: done(longJob, 0) }, T0, 'initial'), ['CLAUDE JOB 0 END', 'CLAUDE JOB 1 END']);
  st = C.newState(); C.step(st, { j: longJob }, T0, 'initial');
  eq('resync while it just finished -> END, never DONE', C.step(st, { j: done(longJob, 0) }, T0, 'resync'), ['CLAUDE JOB 0 END', 'CLAUDE JOB 1 END']);
  st = C.newState(); C.step(st, { j: longJob }, T0, 'initial');
  const noStart = done(longJob, 0); delete noStart.startedAt;
  eq('done entry without startedAt: uses the start seen while running -> DONE', C.step(st, { j: noStart }, T0, 'live'), ['CLAUDE JOB 0 DONE Long job']);
  eq('doneDecision: never seen running and no startedAt -> END', C.doneDecision(noStart, T0, 0), 'END');
  st = C.newState(); C.step(st, { j: longJob }, T0, 'initial');
  eq('finished between cache and server snapshot (loading) -> END, never DONE', C.step(st, { j: done(longJob, 0) }, T0, 'loading'), ['CLAUDE JOB 0 END']);
  st = C.newState(); C.step(st, { j: longJob }, T0, 'initial');
  eq('loading with nothing changed -> nothing resent', C.step(st, { j: longJob }, T0, 'loading'), []);
  st = C.newState(); C.step(st, { j: longJob, k: b }, T0, 'initial');
  // k started earlier (3 min ago vs 2), so it took slot 0 and the long job slot 1
  eq('DONE frees the slot; the other job stays put', [C.step(st, { j: done(longJob, 0), k: b }, T0, 'live'), st.slots],
    [['CLAUDE JOB 1 DONE Long job'], ['k', null]]);

  document.getElementById('summary').textContent = fail ? `${fail} failed, ${pass} passed` : `All ${pass} passed`;
  document.getElementById('summary').className = fail ? 'bad' : 'ok';
})();
</script>
</body>
</html>
